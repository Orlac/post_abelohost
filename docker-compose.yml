services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: post-app
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./src:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - post-net

  nginx:
    image: nginx:latest
    container_name: post-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./src:/var/www/html:ro
      - ./ngnix.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - post-net

  db:
    image: mysql:latest
    container_name: post-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_EXPOSE_PORT}:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - post-net

networks:
  post-net:
    driver: bridge
